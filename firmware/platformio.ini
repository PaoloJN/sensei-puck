; Water Puck firmware — Adafruit nRF52 core.
; Real target: mdbt50q_puck (carrier board). XIAO nRF52840 Sense = bench mule
; (env:puck + bench_* envs). Structure mirrors openchess.

[platformio]
default_envs = mdbt50q_puck

[env]
; Stock nordicnrf52 platform has no XIAO board def; the community fork adds
; xiaoblesense_adafruit (Adafruit core = Bluefruit BLE + OTA DFU bootloader).
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
; deep+ LDF so core libs (Wire) resolve the framework-bundled TinyUSB
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit AS7341
    adafruit/Adafruit BusIO
    milesburton/DallasTemperature
    paulstoffregen/OneWire

[env:puck]
build_src_filter =
    -<*>
    +<main.cpp>
    +<sensors/>
    +<ec/>
    +<logging/>
    +<ble/>

[env:mdbt50q_puck]
; Puck PCB target: Raytac MDBT50Q-1MV2 bare module, project-local board def
; (boards/mdbt50q_puck.json) + variant (variants/mdbt50q_puck/ — USE_LFRC,
; no DCDC, identity pin map). Uploads via SWD (J-Link/nrfjprog) until the
; custom bootloader lands at commissioning; then BLE/USB DFU.
board = mdbt50q_puck
board_build.variants_dir = variants
build_src_filter =
    -<*>
    +<main.cpp>
    +<sensors/>
    +<ec/>
    +<logging/>
    +<ble/>

; --- Bench bring-up envs: one file each, run on the bare XIAO ---

[env:bench_i2c_scan]
build_src_filter = -<*> +<bench/i2c_scan.cpp>

[env:bench_rf_beacon]
; Jug RSSI test: use the carrier's normal 0 dBm policy.
build_src_filter = -<*> +<bench/rf_beacon.cpp>

[env:bench_ec]
build_src_filter = -<*> +<bench/ec_bringup.cpp>
